<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">Factura con IVA e IRPF</title><desc id="d">Anuncio educativo de Haz la Factura</desc><rect width="1080" height="1080" fill="#172b2a"/><rect x="80" y="80" width="920" height="920" rx="48" fill="#fff"/><text x="145" y="180" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#172b2a">Haz la <tspan fill="#d4662f">Factura</tspan></text><text x="145" y="335" font-family="Arial,sans-serif" font-size="75" font-weight="800" fill="#172b2a">¿Factura con IVA</text><text x="145" y="425" font-family="Arial,sans-serif" font-size="75" font-weight="800" fill="#172b2a">e IRPF?</text><rect x="145" y="510" width="790" height="220" rx="30" fill="#f7f4ed"/><text x="195" y="585" font-family="Arial,sans-serif" font-size="35" fill="#405653">Base: 1.000 €</text><text x="195" y="645" font-family="Arial,sans-serif" font-size="35" fill="#405653">IVA 21 %: +210 € · IRPF 15 %: −150 €</text><text x="195" y="705" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#d4662f">Total: 1.060 €</text><text x="145" y="830" font-family="Arial,sans-serif" font-size="36" fill="#172b2a">Calcula y genera el PDF gratis.</text><text x="145" y="910" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#d4662f">hazlafactura.es</text></svg>
