<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d"><title id="t">Facturación privada</title><desc id="d">Anuncio de privacidad de Haz la Factura</desc><rect width="1080" height="1080" fill="#f1b24a"/><path d="M0 760C230 620 410 850 650 700s310-30 430-100v480H0z" fill="#d4662f" opacity=".22"/><rect x="90" y="90" width="900" height="900" rx="48" fill="#fff"/><text x="145" y="185" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#172b2a">Haz la <tspan fill="#d4662f">Factura</tspan></text><text x="145" y="360" font-family="Arial,sans-serif" font-size="78" font-weight="800" fill="#172b2a">Tus facturas son</text><text x="145" y="455" font-family="Arial,sans-serif" font-size="78" font-weight="800" fill="#d4662f">asunto tuyo.</text><text x="145" y="590" font-family="Arial,sans-serif" font-size="40" fill="#405653">Los datos no salen de tu navegador.</text><text x="145" y="655" font-family="Arial,sans-serif" font-size="40" fill="#405653">Sin cuenta. Sin nube. Sin cuotas.</text><rect x="145" y="760" width="510" height="110" rx="28" fill="#172b2a"/><text x="400" y="831" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#fff">Pruébalo gratis</text><text x="145" y="930" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172b2a">hazlafactura.es</text></svg>
